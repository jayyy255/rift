name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
            tools/lint/go.sum
      - name: Format, vet, lint, proto drift, race checks, and build
        run: make check
      - name: Command smoke checks
        run: |
          ./bin/rift --version
          ./bin/rift-broker --help
      - name: Docker image build
        run: docker build -t rift:ci .
