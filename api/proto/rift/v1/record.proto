syntax = "proto3";

package rift.v1;

// Header is an application-defined key/value pair carried with a record.
// Header keys may repeat; order is preserved.
message Header {
  string key = 1;
  bytes value = 2;
}

// Record is a stored record as returned to consumers.
message Record {
  // Offset of the record within its partition.
  int64 offset = 1;
  // Broker append time, Unix milliseconds.
  int64 timestamp_ms = 2;
  // Absent for keyless records. An empty but present key is a valid key.
  optional bytes key = 3;
  bytes value = 4;
  repeated Header headers = 5;
}
