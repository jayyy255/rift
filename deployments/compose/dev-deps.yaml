# Development dependencies: observability and fault injection.
# The broker runs on the host (make run); Prometheus scrapes it via host-gateway.
# A three-broker cluster service set will be added with milestone R2.
name: rift-dev

services:
  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
    ports: ["9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]

  grafana:
    image: grafana/grafana:13.2.6
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro,Z
    ports: ["3000:3000"]
    depends_on: [prometheus]

  # Network fault injection for chaos tests (latency, partitions, resets).
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.13.0
    ports: ["8474:8474"]
    extra_hosts: ["host.docker.internal:host-gateway"]
